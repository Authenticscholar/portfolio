  <text class="muted font" x="60" y="122">Conceptual architecture (public summary)</text>
  <rect class="box2" x="60" y="160" width="360" height="155" rx="12" ry="12"/>
  <text class="label font" x="85" y="195">Assessment</text>
  <text class="text font" x="85" y="220">Regulatory and policy fit</text>
  <text class="muted font" x="105" y="245">Compliance, data security, cost-effectiveness</text>
  <text class="text font" x="85" y="273">Adoption enablers</text>
  <text class="muted font" x="105" y="298">Prioritised readiness factors across stakeholders</text>
  <rect class="box2" x="450" y="160" width="470" height="155" rx="12" ry="12"/>
  <text class="label font" x="475" y="195">Infrastructure blueprint</text>
  <text class="text font" x="475" y="220">Blockchain-backed market model</text>
  <text class="muted font" x="500" y="245">Aligned to UNFCCC monitoring and reporting flows</text>
  <text class="text font" x="475" y="273">Smart contracts and data integration</text>
  <text class="muted font" x="500" y="298">Auditable records; double-counting controls</text>
  <path class="arrow" d="M420 236 C435 236, 436 236, 448 236" />
  <path class="arrow" d="M420 275 C435 275, 436 275, 448 275" />
  <rect class="box2" x="60" y="335" width="860" height="165" rx="12" ry="12"/>
  <text class="label font" x="85" y="370">Outcomes and study context</text>
  <text class="text font" x="85" y="400">Outputs</text>
  <text class="muted font" x="105" y="426">Transparency, auditability, and transaction integrity</text>
  <text class="muted font" x="105" y="448">NDC and corporate target monitoring support</text>
  <text class="text font" x="540" y="400">Study areas</text>
  <text class="muted font" x="560" y="426">UNFCCC RCC (Kampala) — regional implementation context</text>
  <text class="muted font" x="560" y="448">CYNK (Kenya) — end-to-end blockchain carbon platform</text>
