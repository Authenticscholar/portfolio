<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <style>
    .font { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #12263a; }
    .sub { font-size: 12px; font-weight: 700; fill: #b08d3a; letter-spacing: .06em; text-transform: uppercase; }
    .label { font-size: 13px; fill: #1c2430; font-weight: 700; }
    .text { font-size: 12.5px; fill: #1c2430; }
    .muted { font-size: 12px; fill: #5c6774; }
    .box { fill: #ffffff; stroke: #d7dde5; stroke-width: 2; }
    .box2 { fill: #f7f9fb; stroke: #d7dde5; stroke-width: 2; }
    .arrow { stroke: #12263a; stroke-width: 2.5; fill: none; marker-end: url(#arrowHead); }
  </style>
  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#12263a" />
    </marker>
  </defs>
  <rect class="box" x="20" y="20" width="940" height="520" rx="14" ry="14"/>
  <text class="sub font" x="60" y="64">PAUWES · MSc Climate Change Engineering</text>
